<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>4,3" · Calibração das entradas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3394D2}a:hover{color:#66AFDD}
</style>
</helmet>
<div style="width: 480px; height: 800px; box-sizing: border-box; background: #0F141A; color: #E8ECF1; font-family: Roboto, 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: #1A2230; border-bottom: 1px solid #2A3445">
    <a href="Config43.dc.html" style="font-size: 18px; font-weight: 500; text-decoration: none; color: #3394D2">‹ Configuração</a>
    <span style="font-size: 19.5px; font-weight: 700">Calibração</span>
    <span style="width: 105px"></span>
  </div>
  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 9px; padding: 9px 12px">
    <div style="flex-shrink: 0; background: #1A2230; border: 1px solid #2A3445; border-radius: 6px; padding: 9px 12px 9px 15px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <span style="font-size: 19.5px; font-weight: 700">1 · Zero</span>
        <button type="button" onClick="{{doZero}}" style="height: 54px; width: 186px; border: 1px solid #3394D2; border-radius: 6px; background: #232C3B; color: #E8ECF1; font: 500 18px Roboto, sans-serif; cursor: pointer">Calibrar zero</button>
      </div>
      <span style="font-size: 16.5px; color: #9FB3C8">Sensores desconectados (0 mA).</span>
      <span style="font-size: 16.5px; color: {{zeroColor}}">{{zeroText}}</span>
    </div>
    <div style="flex-shrink: 0; background: #1A2230; border: 1px solid #2A3445; border-radius: 6px; padding: 9px 12px 9px 15px; display: flex; flex-direction: column; gap: 6px; opacity: {{gainOpacity}}">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <span style="font-size: 19.5px; font-weight: 700">2 · Ganho</span>
        <button type="button" onClick="{{doGain}}" style="height: 54px; width: 186px; border: 1px solid #3394D2; border-radius: 6px; background: #232C3B; color: #E8ECF1; font: 500 18px Roboto, sans-serif; cursor: pointer">Calibrar 20 mA</button>
      </div>
      <span style="font-size: 16.5px; color: #9FB3C8">Injete 20,00 mA; calibra os canais entre 18 e 22 mA.</span>
      <span style="font-size: 16.5px; color: #9FB3C8">{{gainText}}</span>
    </div>
    <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); grid-auto-flow: column; gap: 9px">
      <sc-for list="{{chans}}" as="c" hint-placeholder-count="8">
        <div style="background: #1A2230; border: 1px solid {{c.border}}; border-radius: 6px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 6px">
          <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
            <div style="display: flex; align-items: baseline; gap: 9px">
              <span style="font-size: 18px; font-weight: 700">CH{{c.n}}</span>
              <span style="font-family: 'Roboto Mono', monospace; font-size: 18px; font-weight: 700; color: #E8ECF1">{{c.meas}}</span>
              <span style="font-size: 15px; color: #9FB3C8">mA</span>
            </div>
            <span style="font-family: 'Roboto Mono', monospace; font-size: 15px; color: #9FB3C8; white-space: nowrap">{{c.detail}}</span>
          </div>
          <span style="font-size: 16.5px; font-weight: 500; color: {{c.color}}">{{c.mark}}</span>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="height: 78px; flex-shrink: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; padding: 0 12px 9px">
    <button type="button" onClick="{{doReset}}" style="height: 66px; border: 1px solid #3F4D62; border-radius: 6px; background: #232C3B; color: #E8ECF1; font: 500 19.5px Roboto, sans-serif; cursor: pointer">Restaurar padrão</button>
    <button type="button" style="height: 66px; border: 0; border-radius: 6px; background: #33BC33; color: #003E00; font: 700 19.5px Roboto, sans-serif">Salvar</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { zero: false, cal: [false, false, false, false, false, false, false, false], next: 0, last: '' };
  }
  renderVals() {
    var self = this, st = this.state;
    var offsets = [0.012, -0.008, 0.015, 0.004, -0.011, 0.009, 0.006, -0.003];
    var gains = [1.0021, 0.9987, 1.0013, 1.0034, 0.9992, 1.0008, 0.9979, 1.0016];
    var fmt = function (v, d) { return v.toFixed(d).replace('.', ',').replace('-', '\u2212'); };
    var done = st.cal.filter(Boolean).length;
    return {
      zeroText: st.zero ? 'Zero salvo nos 8 canais' : 'Pendente',
      zeroColor: st.zero ? '#66CD66' : '#9FB3C8',
      gainOpacity: st.zero ? '1' : '0.45',
      gainText: !st.zero ? 'Faça o zero primeiro' : (st.last || (done + ' de 8 canais')),
      doZero: function () { self.setState({ zero: true, cal: [false, false, false, false, false, false, false, false], next: 0, last: '' }); },
      doGain: function () {
        if (!self.state.zero || self.state.next > 7) return;
        var cal = self.state.cal.slice(), i = self.state.next;
        cal[i] = true;
        self.setState({ cal: cal, next: i + 1, last: 'CH' + (i + 1) + ': 19,96 mA \u2192 calibrado' });
      },
      doReset: function () { self.setState({ zero: false, cal: [false, false, false, false, false, false, false, false], next: 0, last: '' }); },
      chans: st.cal.map(function (ok, i) {
        return {
          n: i + 1,
          meas: fmt(!st.zero ? offsets[i] : (ok && i === st.next - 1 ? 20.0 : 0), 3),
          detail: (st.zero ? fmt(offsets[i], 3) + ' mA' : '\u2014') + ' \u00b7 ' + (ok ? '\u00d7' + fmt(gains[i], 4) : '\u00d71,0000'),
          mark: ok ? '\u2713 OK' : (st.zero ? 'ganho' : 'zero'),
          color: ok ? '#66CD66' : '#9FB3C8',
          border: ok ? '#2F6B3A' : '#2A3445'
        };
      })
    };
  }
}
</script>
</body>
</html>
